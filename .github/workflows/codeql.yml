name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze-go:
    name: Analyze Go
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          
      - uses: github/codeql-action/init@v4
        with:
          languages: go
          
      - name: Build Go
        working-directory: ./backend
        run: |
          go mod download
          go build ./...
          
      - uses: github/codeql-action/analyze@v4

  analyze-js:
    name: Analyze JS/TS
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          
      - uses: github/codeql-action/analyze@v4