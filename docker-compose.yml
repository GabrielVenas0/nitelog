services:
  db:
    image: postgres:15-alpine
    ports:
      - "${DB_PORT}:${DB_PORT}"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_POSTGRES}

    volumes:
      - "./.docker/db-data:/var/lib/postgres/data"
      - "./backend/sql/schema:/docker-entrypoint-initdb.d"
